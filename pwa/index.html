<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#00e676">
    <title>Qxfer</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main id="home" class="home">
        <h1>Qxfer</h1>
        <p class="tagline">انتقال فایل با نور</p>
        <p class="hint">بدون CDN — اگر صفحهٔ QR قدیمی می‌بینید Ctrl+F5 بزنید</p>
        <p id="lanHint" class="lan-hint"></p>
        <p id="homeError" class="home-error" hidden></p>
        <input id="joinCode" class="join-code" type="text" maxlength="8" placeholder="کد نشست" autocomplete="off" autocapitalize="characters" spellcheck="false" dir="ltr">
        <button id="btnSend" class="mega send" type="button">ارسال</button>
        <button id="btnRecv" class="mega recv" type="button">دریافت</button>
        <input id="fileInput" type="file" hidden>
    </main>

    <section id="stage" class="stage" hidden>
        <video id="cam" autoplay playsinline muted></video>
        <canvas id="qrCanvas"></canvas>
        <div id="guide" class="guide" hidden></div>
        <div id="hud" class="hud"></div>
        <button id="btnClose" class="close" type="button">بستن</button>
        <div id="meetCode" class="meet-code" hidden></div>
        <button id="btnStart" class="start-btn" hidden type="button">شروع کن</button>
        <a id="downloadLink" class="download" hidden>دانلود فایل</a>
    </section>

    <script src="js/lzma_worker.min.js"></script>
    <script src="js/protocol.js"></script>
    <script src="js/codec.js"></script>
    <script src="js/app.js"></script>
    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(regs.map(function (reg) { return reg.unregister(); }));
            }).then(function () {
                if (!window.caches) return;
                return caches.keys().then(function (keys) {
                    return Promise.all(keys.map(function (key) { return caches.delete(key); }));
                });
            }).catch(function () {});
        }
    </script>
</body>
</html>
