<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#00e676">
    <title>Qxfer</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main id="home" class="home">
        <h1>Qxfer</h1>
        <p class="tagline">انتقال فایل با نور</p>
        <button id="btnSend" class="mega send" type="button">ارسال</button>
        <button id="btnRecv" class="mega recv" type="button">دریافت</button>
        <input id="fileInput" type="file" hidden>
    </main>

    <section id="stage" class="stage" hidden>
        <video id="cam" autoplay playsinline muted></video>
        <canvas id="qrCanvas"></canvas>
        <div id="guide" class="guide" hidden></div>
        <div id="hud" class="hud"></div>
        <button id="btnClose" class="close" type="button">بستن</button>
        <a id="downloadLink" class="download" hidden>دانلود فایل</a>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <script src="js/lzma_worker.min.js"></script>
    <script src="js/protocol.js"></script>
    <script src="js/app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js').catch(() => {});
            });
        }
    </script>
</body>
</html>
